!! SpinQuest PYTHIA8 configuration for Drell-Yan in pp/pn.
!!
!! You should adjust mHatMin when interested in low-mass region.

! Beam settings
Beams:frameType = 2
Beams:idA       = 2212
Beams:eA        = 120.
Beams:eB        = 0.
Beams:allowVertexSpread = on

! PDF etc.
#PDF:pSet = 7                     ! CTEQ6L
#ParticleDecays:limitTau = off    ! Only decays the unstable particles
#ParticleDecays:limitTau0 = off   ! Only decays the unstable particles

! Process selection
WeakSingleBoson:ffbar2ffbar(s:gm) = on     ! ffbar -> gamma* -> ffbar

! Cuts
PhaseSpace:mHatMin = 0.25  ! default = 4.; minimum = 0.
PhaseSpace:mHatMax = 10.0  ! default = 4.; minimum = 0.

! When you study low pT region such as low mass and |cos(theta)|~1,
! you better confirm the generated kinematics is not distorted,
! by varying these parameters;
PhaseSpace:pTHatMinDiverge = 0.5 ! (default = 1.0; minimum = 0.5)
#BeamRemnants:primordialKT = no
! Tune 25: low-mass kT scan (Sobol design, only the lines below differ between tunes)
BeamRemnants:primordialKTsoft = 0.886
BeamRemnants:primordialKThard = 1.231
BeamRemnants:halfScaleForKT = 1.304
BeamRemnants:halfMassForKT = 2.161

! Tune 38: mass-shape test on top of the tune 25 kT settings (factorization scale and hard-process PDF)
SigmaProcess:factorScale2 = 4      ! PDFs evaluated at Q^2 = sHat (Q = mass), as in the legacy generator; default 1 = min mT^2
PDF:useHard = on                   ! separate PDF for the hard process only (shower and remnants keep the default)
PDF:pHardSet = LHAGrid1:/cvmfs/seaquest.opensciencegrid.org/seaquest/software/e1039/share/20250519/share/LHAPDF/CT10nlo/CT10nlo_0000.dat

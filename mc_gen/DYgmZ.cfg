!! SpinQuest PYTHIA8 configuration for Drell-Yan: 2 -> 1 variant to try.
!!
!! Differs from phpythia8_DY_tuned.cfg only in the "Process selection" and
!! "Cuts" blocks. Beam, primordial-kT tune and hard-process PDF are unchanged,
!! so a comparison with the tuned config isolates the process change.

! Beam settings (unchanged)
Beams:frameType = 2
Beams:idA       = 2212
Beams:eA        = 120.
Beams:eB        = 0.
Beams:allowVertexSpread = on
#Beams:idB      = 2112             ! neutron target; the default 2212 is a proton target

! Process selection
! q qbar -> gamma* as a 2 -> 1 resonance process (code 221), photon exchange only.
! Unlike ffbar2ffbar(s:gm) this has no pTHat cut, so the full cos(theta) range
! is generated at every mass, and every event is a dimuon.
WeakSingleBoson:ffbar2gmZ = on
WeakZ0:gmZmode = 1                 ! gamma* only, no Z0 or interference
23:onMode  = off                   ! switch off all gamma*/Z0 decay channels ...
23:onIfAny = 13                    ! ... then switch mu+ mu- back on

! Cuts
! The mass window is set in two places and both must agree: the phase-space cut
! and the mass range of particle 23 (its default lower limit is 10 GeV).
! 1.0 GeV matches where phpythia8_DY_tuned.cfg effectively starts (its pTHat cut
! removes everything below 1 GeV). Going lower is allowed, but then almost all
! events are generated below 1 GeV.
PhaseSpace:mHatMin = 0.25
PhaseSpace:mHatMax = 10.0
23:mMin = 0.25
23:mMax = 10.0

! Primordial kT (unchanged: crude matching to the legacy pT)
BeamRemnants:primordialKTsoft = 0.886
BeamRemnants:primordialKThard = 1.231
BeamRemnants:halfScaleForKT = 1.304
BeamRemnants:halfMassForKT = 2.161

! Hard-process PDF (unchanged). The factorization scale is Q^2 = sHat by
! default for 2 -> 1 processes, so no SigmaProcess line is needed.
PDF:useHard = on                   ! separate PDF for the hard process only (shower and remnants keep the default)
PDF:pHardSet = LHAGrid1:/cvmfs/seaquest.opensciencegrid.org/seaquest/software/e1039/share/20250519/share/LHAPDF/CT10nlo/CT10nlo_0000.dat
